name: Build Private Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || (echo "Missing KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.KEYSTORE_PASSWORD }}" || (echo "Missing KEYSTORE_PASSWORD" && exit 1)
          test -n "${{ secrets.KEY_PASSWORD }}" || (echo "Missing KEY_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          keytool -list -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias routemonitor >/dev/null

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Find Android build tools
        id: bt
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Sign private APK
        run: |
          "${{ steps.bt.outputs.apksigner }}" sign             --ks release.keystore             --ks-key-alias routemonitor             --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}"             --key-pass "pass:${{ secrets.KEY_PASSWORD }}"             --out app/build/outputs/apk/release/RouteMonitor-private-release.apk             app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK and print certificate
        shell: bash
        run: |
          "${{ steps.bt.outputs.apksigner }}" verify --verbose --print-certs             app/build/outputs/apk/release/RouteMonitor-private-release.apk
          sha256sum app/build/outputs/apk/release/RouteMonitor-private-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RouteMonitor-private-release
          path: app/build/outputs/apk/release/RouteMonitor-private-release.apk
          if-no-files-found: error
