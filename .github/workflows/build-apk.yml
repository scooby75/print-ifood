name: Build Android Release
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK and AAB
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Generate temporary release signing key
        run: |
          keytool -genkeypair -v -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" -alias routemonitor -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RouteMonitor, OU=Mobile, O=GoalStats, L=Joao Pessoa, ST=PB, C=BR"

      - name: Locate Android build tools
        id: bt
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        run: |
          "${{ steps.bt.outputs.apksigner }}" sign             --ks release.keystore --ks-key-alias routemonitor             --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}"             --key-pass "pass:${{ secrets.KEY_PASSWORD }}"             --out app/build/outputs/apk/release/RouteMonitor-v1.1-release.apk             app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign AAB
        run: |
          jarsigner -keystore release.keystore             -storepass "${{ secrets.KEYSTORE_PASSWORD }}"             -keypass "${{ secrets.KEY_PASSWORD }}"             app/build/outputs/bundle/release/app-release.aab routemonitor
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/RouteMonitor-v1.1.aab

      - name: Verify artifacts
        run: |
          "${{ steps.bt.outputs.apksigner }}" verify --verbose app/build/outputs/apk/release/RouteMonitor-v1.1-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/RouteMonitor-v1.1.aab

      - uses: actions/upload-artifact@v4
        with:
          name: RouteMonitor-v1.1-PlayStore
          path: |
            app/build/outputs/apk/release/RouteMonitor-v1.1-release.apk
            app/build/outputs/bundle/release/RouteMonitor-v1.1.aab
          if-no-files-found: error
